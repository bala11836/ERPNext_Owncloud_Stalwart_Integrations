http:
  routers:
    cloud-push-registration:
      rule: Host(`erp.example.com`) && Path(`/api/method/frappe.push_notification.auth_webhook`)
        && Method(`GET`)
      entryPoints:
      - https
      priority: 310
      service: public-erp@file
      middlewares:
      - cloud-push-untrusted-headers
      tls: {}
    cloud-push-worker:
      rule: Host(`erp.example.com`) && Path(`/api/method/erpnext_drive_integrations.portal.push.worker`)
        && Method(`GET`)
      entryPoints:
      - https
      priority: 310
      service: public-erp@file
      middlewares:
      - cloud-push-untrusted-headers
      tls: {}
    cloud-push-worker-consolidated:
      rule: Host(`erp.example.com`) && Path(`/api/method/erpnext_drive_integrations.portal.push.worker`)
        && Method(`GET`)
      entryPoints:
      - https
      priority: 310
      service: public-erp@file
      middlewares:
      - cloud-push-untrusted-headers
      tls: {}
  middlewares:
    cloud-push-untrusted-headers:
      headers:
        customRequestHeaders:
          X-authentik-username: ''
          X-authentik-email: ''
          X-authentik-groups: ''
          X-authentik-uid: ''
          X-authentik-jwt: ''
          X-authentik-meta-jwks: ''
