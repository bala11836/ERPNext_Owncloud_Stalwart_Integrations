http:
  routers:
    cloud-raven-mobile-discovery:
      rule: Host(`erp.example.com`) && Path(`/api/method/raven.api.raven_mobile.get_client_id`)
        && (Method(`GET`) || Method(`OPTIONS`))
      entryPoints:
      - https
      priority: 310
      service: public-erp@file
      middlewares:
      - cloud-raven-discovery-headers
      tls: {}
  middlewares:
    cloud-raven-discovery-headers:
      headers:
        customRequestHeaders:
          X-authentik-username: ''
          X-authentik-email: ''
          X-authentik-groups: ''
          X-authentik-uid: ''
          X-authentik-jwt: ''
          X-authentik-meta-jwks: ''
