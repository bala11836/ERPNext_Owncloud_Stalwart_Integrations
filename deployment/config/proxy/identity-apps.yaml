http:
  routers:
    erp-public:
      rule: Host(`erp.example.com`)
      entryPoints:
      - https
      priority: 200
      service: public-erp
      middlewares:
      - public-app-auth
      tls:
        certResolver: letsencrypt
    erp-public-auth:
      rule: Host(`erp.example.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      entryPoints:
      - https
      priority: 300
      service: public-authentik
      tls: {}
    erp-public-login:
      rule: Host(`erp.example.com`) && (Path(`/login`) || Path(`/signed-out`) || Path(`/api/method/erpnext_drive_integrations.portal.sso.start_signin`)
        || PathPrefix(`/assets/`) || Path(`/api/method/erpnext_drive_integrations.portal.sso.finish_logout`)
        || Path(`/api/method/erpnext_drive_integrations.portal.sso.session_status`))
      entryPoints:
      - https
      priority: 250
      service: public-erp
      tls: {}
    erp-public-http:
      rule: Host(`erp.example.com`)
      entryPoints:
      - http
      service: public-erp
      middlewares:
      - public-app-https
    erp-public-login-consolidated:
      rule: Host(`erp.example.com`) && (Path(`/login`) || Path(`/signed-out`) || Path(`/api/method/erpnext_drive_integrations.portal.sso.start_signin`)
        || PathPrefix(`/assets/`) || Path(`/api/method/erpnext_drive_integrations.portal.sso.finish_logout`)
        || Path(`/api/method/erpnext_drive_integrations.portal.sso.session_status`))
      entryPoints:
      - https
      priority: 250
      service: public-erp
      tls: {}
  middlewares:
    public-app-auth:
      forwardAuth:
        address: http://cloud-authentik:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-uid
    public-app-https:
      redirectScheme:
        scheme: https
        permanent: true
    cloud-collab-strip:
      stripPrefix:
        prefixes:
        - /collab
  services:
    public-authentik:
      loadBalancer:
        servers:
        - url: http://cloud-authentik:9000
    public-erp:
      loadBalancer:
        servers:
        - url: http://erp-frontend:8080
