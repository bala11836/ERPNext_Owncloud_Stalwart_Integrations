http:
  routers:
    office-smtp-acme-validation:
      entryPoints:
      - http
      rule: Host(`mx.example.com`) && PathPrefix(`/.well-known/acme-challenge/`)
      priority: 2000
      service: office-mail-jmap@docker
    office-web-acme-validation:
      entryPoints:
      - http
      rule: (Host(`office.example.com`) || Host(`docs.example.com`) || Host(`dms.example.com`)
        || Host(`mail.example.com`)) && PathPrefix(`/.well-known/acme-challenge/`)
      priority: 1000
      service: acme-http@internal
