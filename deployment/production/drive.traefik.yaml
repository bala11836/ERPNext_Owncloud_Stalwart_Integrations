# P45 production route: drive.example.com -> repository-built Drive (oCIS).
# Replaces the Coolify container labels of the pre-repository Drive service.
# Keeps its two behaviours: compression except for event streams, and the
# portal frame permission middleware `place-holder-xfo@file` (defined in
# place-holder-frames.yaml on the same proxy). Rendered at deployment by
# replacing drive.example.com with the production Drive host; see
# docs/production-moves.md.
http:
  routers:
    drive-repository:
      rule: Host(`drive.example.com`)
      entryPoints:
      - https
      priority: 100
      service: drive-repository
      middlewares:
      - drive-repository-compress
      - place-holder-xfo@file
      tls:
        certResolver: letsencrypt
    drive-repository-http:
      rule: Host(`drive.example.com`)
      entryPoints:
      - http
      priority: 10
      service: drive-repository
      middlewares:
      - drive-repository-https
  middlewares:
    drive-repository-compress:
      compress:
        excludedContentTypes:
        - text/event-stream
    drive-repository-https:
      redirectScheme:
        scheme: https
        permanent: true
  services:
    drive-repository:
      loadBalancer:
        passHostHeader: true
        servers:
        - url: http://drive-ocis-production:9200
