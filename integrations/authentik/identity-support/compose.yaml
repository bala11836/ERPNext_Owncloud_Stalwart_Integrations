services:
  gateway:
    image: nginx@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    container_name: cloud-production-gateway
    restart: unless-stopped
    volumes:
    - /opt/cloud/stacks/identity-support/nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/cloud-integrations/certificates:/cert:ro
    networks:
      erp-production:
        aliases:
        - cloud-internal-gateway
      identity-production:
        aliases:
        - cloud-internal-gateway
      coolify:
        aliases:
        - cloud-internal-gateway
  invitations:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: cloud-invitations
    restart: unless-stopped
    volumes:
    - /data/cloud-invitations/public:/srv/public:ro
    - /data/cloud-invitations/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      coolify:
        aliases:
        - cloud-invitations
      identity-production: {}
networks:
  erp-production:
    external: true
  identity-production:
    external: true
  coolify:
    external: true
