services:
  gateway:
    image: nginx@sha256:6437a63b5c529f0e06162b3f593c0154cff6fa2ea0f94fd7c27928cb399e022d
    container_name: cloud-production-gateway
    restart: unless-stopped
    volumes:
    - /opt/cloud/stacks/identity-support/nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/cloud-integrations/certificates:/cert:ro
    networks:
      erp-production:
        aliases:
        - cloud-internal-gateway
      identity-production:
        aliases:
        - cloud-internal-gateway
      coolify:
        aliases:
        - cloud-internal-gateway
  invitations:
    image: nginx@sha256:6437a63b5c529f0e06162b3f593c0154cff6fa2ea0f94fd7c27928cb399e022d
    container_name: cloud-invitations
    restart: unless-stopped
    volumes:
    - /data/cloud-invitations/public:/srv/public:ro
    - /data/cloud-invitations/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      coolify:
        aliases:
        - cloud-invitations
      identity-production: {}
networks:
  erp-production:
    external: true
  identity-production:
    external: true
  coolify:
    external: true
