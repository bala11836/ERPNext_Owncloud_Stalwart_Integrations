worker_processes auto;
events { worker_connections 256; }
http {
 access_log off;
 resolver 127.0.0.11 valid=10s ipv6=off;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 server {
  listen 443 ssl; server_name sso.example.com;
  ssl_certificate /cert/fullchain.pem; ssl_certificate_key /cert/privkey.pem;
  location / {
   set $target cloud-authentik;
   proxy_pass http://$target:9000;
   proxy_set_header Host sso.example.com;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
  }
 }
 server {
  listen 18081; server_name _; client_max_body_size 32k;
  location = /erp {
   limit_except POST { deny all; }
   set $target frontend-erp-production;
   proxy_pass http://$target:8080/api/method/erpnext_drive_integrations.portal.sso.backchannel;
   proxy_set_header Host erp.example.com; proxy_set_header Cookie ""; proxy_set_header Authorization "";
  }
  location / { return 404; }
 }
}
