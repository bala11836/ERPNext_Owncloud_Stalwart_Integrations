services:
  invitations:
    image: nginx:1.28-alpine
    container_name: cloud-invitations
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1770
    volumes:
      - ./public:/srv/public:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [coolify, authentik]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  coolify:
    external: true
  authentik:
    external: true
    name: ${AUTHENTIK_NETWORK:?Set the private authentik network}
