worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name sso.example.com;
        absolute_redirect off;
        server_tokens off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        location = /healthz { return 200 "ok\n"; }
        location = /admin-invitations { return 302 /admin-invitations/; }
        location /admin-invitations/ {
            auth_request /__invitation_admin_check;
            error_page 401 403 = @sign_in;
            alias /srv/public/;
            index index.html;
            autoindex off;
        }
        location = /__invitation_admin_check {
            internal;
            proxy_pass http://cloud-authentik:9000/api/v3/core/users/?page_size=1;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization "";
            proxy_set_header Host sso.example.com;
            proxy_set_header X-Forwarded-Proto https;
        }
        location @sign_in { return 302 /if/admin/; }
        location / { return 404; }
    }
}
