# Static front page. Listens on 8080 inside the workspace network; TLS is
# terminated by the proxy. No upstreams, no cookies, no access to business data.
server {
    listen 8080 default_server;
    server_name _;
    root /srv/site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Caching uses "expires" (not add_header): a location with its own
    # add_header would silently drop the security headers above.
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location ~ /\. { deny all; }
    location / {
        expires 1h;
        try_files $uri =404;
    }
}
