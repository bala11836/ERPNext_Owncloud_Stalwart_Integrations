<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SITE_TITLE__</title>
<link rel="icon" href="front/favicon.svg" type="image/svg+xml">
<link rel="icon" href="front/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="front/favicon-180.png">
<style>
  :root { --orange: #DB7410; --blue: #1F72C4; --pencil: #9199a1; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #fff; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; overflow: hidden; }

  /* an original pencil drawing of a tunnel construction site, drawn stroke by stroke in four batches */
  .art { position: fixed; inset: 0; width: 100%; height: 100%; }
  .art g { fill: none; stroke: var(--pencil); stroke-linecap: round; stroke-linejoin: round; }
  .d { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--du) cubic-bezier(.4,.1,.3,1) var(--dl) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* The stage covers the viewport but holds nothing interactive: it must not swallow clicks. */
  .stage { pointer-events: none; position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: clamp(12px, 2.2vh, 26px); padding-bottom: 6vh; }
  .logo { width: min(440px, 62vw); height: auto; opacity: 0; animation: rise 1.6s ease-out .3s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* typed letter by letter, bold */
  .soon { margin: 0; min-height: 1.3em; color: var(--orange); font-weight: 700; font-size: clamp(15px, 2vw, 27px); }
  .soon span { opacity: 0; animation: show .01s linear forwards; }
  @keyframes show { to { opacity: 1; } }

  /* plain two-line text in the logo's blue; "Employee" is condensed to the width of "Zone" */
  .zone { z-index: 3; position: fixed; top: clamp(16px, 2.8vh, 30px); left: clamp(18px, 3vw, 38px); color: var(--blue); text-decoration: none;
          font-size: clamp(12px, 1.1vw, 15px); font-weight: 700; line-height: 1.25; letter-spacing: .06em; text-transform: uppercase; opacity: 0; animation: rise 1.4s ease-out 2.5s forwards; }
  .zone span { display: block; width: fit-content; white-space: nowrap; }
  .zone #z1 { font-size: .8em; transform-origin: 0 50%; }
  .zone #z2 { font-size: 1.1em; }
  .zone:hover, .zone:focus-visible { text-decoration: underline; outline: none; }
  /* shown at once after a click: the sign-in hops can take seconds, and a second click would cancel the first */
  .zone.opening { text-decoration: underline; cursor: progress; animation: opening .9s ease-in-out infinite; }
  @keyframes opening { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  .test-banner { position: fixed; top: 0; right: 0; z-index: 9; padding: 3px 12px; background: #e8590c; color: #fff; font: 700 11px/1.5 "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; border-bottom-left-radius: 8px; }
  /* P63 options: the entry link as a badge top left (like the TEST SITE badge), and the art to show */
  .zone-badge .zone { top: 0; left: 0; padding: 3px 12px; background: var(--zone-bg, #1F3A5F); color: #fff;
          font: 700 11px/1.5 "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; border-bottom-right-radius: 8px; }
  .zone-badge .zone span { display: inline; }
  .zone-badge .zone:hover, .zone-badge .zone:focus-visible { text-decoration: none; filter: brightness(1.25); }
  .art-flower .art { display: none; }
  .art-pencil .flower { display: none; }
  /* a hand-drawn flower and a bee (after the owner's sketch): outlines drawn first, then the colours come in */
  /* the flower sits just right of the logo; logo and flower are centred together */
  .art-flower { --L: min(440px, 62vw); --h: min(47vh, 384px); --w: calc(var(--h) * 2 / 3); --gap: 12px; }
  .flower { position: fixed; left: calc(50% + (var(--L) + var(--gap) - var(--w)) / 2); top: calc(47vh - var(--h) * .42); height: var(--h); width: var(--w); }
  .art-flower .stage { padding-right: calc(var(--w) + var(--gap)); }
  @media (max-aspect-ratio: 1/1) { .flower { left: 50%; top: auto; bottom: 6vh; height: 26vh; width: auto; transform: translateX(-50%); }
    .art-flower .stage { place-content: start center; padding: 20vh 0 0; } }
  .flower .o { fill: none; stroke: #1d1d1d; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .flower .f { opacity: 0; animation: fillin .9s ease-out var(--fl) forwards; }
  @keyframes fillin { to { opacity: 1; } }
  .flower .bee { opacity: 0; animation: fillin .6s ease-out 4.6s forwards, hover 3.2s ease-in-out 5.2s infinite; transform-box: fill-box; }
  @keyframes hover { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(14px, -10px) rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) {
    .flower .f, .flower .bee { animation: none; opacity: 1; }
    .d { animation: none; stroke-dashoffset: 0; }
    .logo, .zone { animation: none; opacity: 1; } .soon span { animation: none; opacity: 1; }
    .zone.opening { animation: none; opacity: .6; }
  }
</style>
</head>

<script>
(function () {
  if (/^test[.-]/.test(location.hostname)) { var b = document.createElement("div"); b.className = "test-banner"; b.textContent = "TEST SITE"; document.body.appendChild(b); }
  var el = document.getElementById('soon'), text = el.getAttribute('data-text') || '';
  if (!text) el.hidden = true;
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.innerHTML = Array.from(text).map(function (c, i) {
    return '<span style="animation-delay:' + (calm ? 0 : (1.6 + i * 0.13)).toFixed(2) + 's">' + (c === ' ' ? '&nbsp;' : c) + '</span>';
  }).join('');
  // squeeze "Employee" to exactly the width of "Zone" (natural spacing for Zone)
  function match() {
    var a = document.getElementById('z1'), b = document.getElementById('z2');
    if (!a || !b) return;   // one-word label or a badge: nothing to match
    a.style.transform = 'none';
    var wa = a.getBoundingClientRect().width, wb = b.getBoundingClientRect().width;
    if (wa > 0) a.style.transform = 'scaleX(' + (wb / wa) + ')';
  }
  var zone = document.querySelector('.zone');
  zone.addEventListener('click', function (e) {
    if (zone.classList.contains('opening')) { e.preventDefault(); return; }
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    zone.classList.add('opening'); zone.setAttribute('aria-busy', 'true');
  });
  window.addEventListener('pageshow', function (ev) { if (ev.persisted) { zone.classList.remove('opening'); zone.removeAttribute('aria-busy'); } });
  match(); window.addEventListener('resize', match);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(match);
})();
</script>
