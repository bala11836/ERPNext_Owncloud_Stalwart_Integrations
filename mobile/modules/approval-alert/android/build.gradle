plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.approvalalert'
version = '0.1.0'

android {
  namespace "expo.modules.approvalalert"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The same version expo-notifications uses (one copy in the app); FCM receives ERPNext's data messages.
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
