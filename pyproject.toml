[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "erpnext_drive_integrations"
version = "0.1.0"
description = "Modular ERPNext workspace, field, onboarding and Drive integrations"
authors = [{name = "Integration Maintainers", email = "maintainers@example.com"}]
requires-python = ">=3.14"
dependencies = ["PyJWT[crypto]>=2.8,<3", "requests>=2.32,<3"]

[tool.flit.module]
name = "erpnext_drive_integrations"

[tool.bench.frappe-dependencies]
frappe = ">=16.56.0,<17.0.0"
erpnext = ">=16.55.0,<17.0.0"
hrms = ">=16.53.2,<17.0.0"
